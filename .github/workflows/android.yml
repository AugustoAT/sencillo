# Compila y prueba en cada push. Al crear una etiqueta v* publica el APK firmado como release.
# Las acciones van fijadas por SHA de commit (no por etiqueta) para que nadie pueda cambiarlas por debajo.
# Corre en Windows porque gradle/verification-metadata.xml tiene los SHA-256 de los binarios de Windows (aapt2).
name: Android

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  probar:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Tests y APK de prueba
        shell: bash
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sencillo-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  publicar:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: probar
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TIENE_CLAVE: ${{ secrets.SENCILLO_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Preparar la clave de firma
        if: env.TIENE_CLAVE == 'true'
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.SENCILLO_KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/sencillo.jks"
      - name: Compilar release firmado
        if: env.TIENE_CLAVE == 'true'
        shell: bash
        env:
          SENCILLO_KEYSTORE: ${{ runner.temp }}/sencillo.jks
          SENCILLO_KEYSTORE_CLAVE: ${{ secrets.SENCILLO_KEYSTORE_CLAVE }}
          SENCILLO_KEY_ALIAS: sencillo
          SENCILLO_KEY_CLAVE: ${{ secrets.SENCILLO_KEYSTORE_CLAVE }}
        run: |
          ./gradlew --no-daemon :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "ahorro-mas-${GITHUB_REF_NAME}.apk"
          sha256sum "ahorro-mas-${GITHUB_REF_NAME}.apk" > "ahorro-mas-${GITHUB_REF_NAME}.apk.sha256"
          rm -f "$SENCILLO_KEYSTORE"
      - name: Publicar en Releases
        if: env.TIENE_CLAVE == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "ahorro-mas-${GITHUB_REF_NAME}.apk" "ahorro-mas-${GITHUB_REF_NAME}.apk.sha256" --title "Ahorro+ $GITHUB_REF_NAME" --notes "APK firmado. Verifica el SHA-256 antes de instalar."
