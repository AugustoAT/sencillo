<title>Sencillo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Albert+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: una columna tipo app de celular (máx. 560px), barra inferior fija con la moneda "+" al centro.
   El saldo del mes es un billete con guilloche; los presupuestos son sobres; la lista es una boleta. */
:root{
  --paper:#EEF2EE; --card:#FFFFFF; --ink:#13221E; --ink-2:#47554F; --muted:#76837E;
  --line:#DCE3DE; --line-2:#C3CDC7;
  --tinta:#0F5A52; --tinta-ink:#FFFFFF; --tinta-soft:#D9EAE4;
  --sol:#B8861E; --sol-hi:#E4B850; --sol-ink:#2A1D03;
  --billete:#DFEDE6; --billete-2:#CFE3DA; --billete-line:rgba(15,90,82,.20); --billete-ink:#0A3D37;
  --s-nec:#2a78d6; --s-gus:#eb6834; --s-aho:#1baf7a; --s-track:#E4E9E5;
  --good:#0ca30c; --good-text:#006300; --warn:#fab219; --warn-text:#8A5A00; --crit:#d03b3b; --crit-text:#B42626;
  --scrim:rgba(10,20,17,.42);
  --shadow:0 1px 0 rgba(19,34,30,.05), 0 10px 28px -16px rgba(19,34,30,.28);
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Albert Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --r-s:8px; --r-m:14px; --r-l:22px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0C1311; --card:#141D1A; --ink:#E6EEEA; --ink-2:#A6B3AD; --muted:#7A8782;
    --line:#22302B; --line-2:#33423C;
    --tinta:#5CC0AF; --tinta-ink:#04201B; --tinta-soft:#16332E;
    --sol:#E0B04A; --sol-hi:#F3CD72; --sol-ink:#2A1D03;
    --billete:#112C27; --billete-2:#163830; --billete-line:rgba(130,215,195,.16); --billete-ink:#D6F0E7;
    --s-nec:#3987e5; --s-gus:#d95926; --s-aho:#199e70; --s-track:#22302B;
    --good-text:#3DC23D; --warn-text:#F2C14E; --crit-text:#FF7E7E;
    --scrim:rgba(0,0,0,.6);
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 12px 30px -16px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0C1311; --card:#141D1A; --ink:#E6EEEA; --ink-2:#A6B3AD; --muted:#7A8782;
  --line:#22302B; --line-2:#33423C;
  --tinta:#5CC0AF; --tinta-ink:#04201B; --tinta-soft:#16332E;
  --sol:#E0B04A; --sol-hi:#F3CD72; --sol-ink:#2A1D03;
  --billete:#112C27; --billete-2:#163830; --billete-line:rgba(130,215,195,.16); --billete-ink:#D6F0E7;
  --s-nec:#3987e5; --s-gus:#d95926; --s-aho:#199e70; --s-track:#22302B;
  --good-text:#3DC23D; --warn-text:#F2C14E; --crit-text:#FF7E7E;
  --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 12px 30px -16px rgba(0,0,0,.7);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--paper); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sol); outline-offset:2px; border-radius:6px}
.wrap{max-width:560px; margin:0 auto; padding-inline:16px; padding-block:8px 128px}

/* ---------- cabecera ---------- */
.top{display:flex; align-items:center; justify-content:space-between; gap:12px; padding-block:8px 4px}
.marca{display:flex; align-items:baseline; gap:8px}
.marca b{font-family:var(--f-display); font-stretch:125%; font-weight:850; font-size:22px; letter-spacing:-.02em}
.marca b i{font-style:normal; color:var(--sol)}
.marca small{font-family:var(--f-mono); font-size:10.5px; color:var(--muted); letter-spacing:.06em; text-transform:uppercase}
.ico-btn{width:40px; height:40px; display:grid; place-items:center; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--ink-2)}
.ico-btn:hover{color:var(--ink); border-color:var(--line-2)}
.ico-btn svg{width:20px; height:20px}
.mesbar{display:flex; align-items:center; justify-content:space-between; margin-block:10px 12px}
.mesbar h1{margin:0; font-family:var(--f-display); font-stretch:100%; font-weight:750; font-size:26px; letter-spacing:-.015em; text-transform:capitalize; text-wrap:balance}
.mesbar h1 span{color:var(--muted); font-weight:500}
.mesnav{display:flex; gap:6px}
.mesnav button{width:36px; height:36px; border-radius:50%; border:1px solid var(--line); background:transparent; display:grid; place-items:center; color:var(--ink-2)}
.mesnav button:disabled{opacity:.35; cursor:default}
.mesnav svg{width:18px; height:18px}

.aviso{display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; background:var(--card); border:1px dashed var(--line-2); border-radius:var(--r-m); padding:10px 12px; margin-bottom:12px; font-size:13.5px; color:var(--ink-2)}
.aviso b{color:var(--ink)}
.aviso .btn-sm{flex:none}

/* ---------- billete ---------- */
.billete{position:relative; overflow:hidden; border-radius:var(--r-l); background:
  linear-gradient(120deg, var(--billete) 0%, var(--billete-2) 100%); color:var(--billete-ink);
  padding:18px 18px 0; box-shadow:var(--shadow); isolation:isolate}
.billete canvas{position:absolute; inset:0; width:100%; height:100%; z-index:-1; pointer-events:none}
.billete .fila1{display:flex; justify-content:space-between; align-items:flex-start; gap:8px}
.eyebrow{font-family:var(--f-mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; font-weight:500}
.serie{font-family:var(--f-mono); font-size:11px; letter-spacing:.08em; opacity:.75; white-space:nowrap}
.monto{font-family:var(--f-display); font-stretch:125%; font-weight:850; line-height:.95; letter-spacing:-.03em; margin-top:14px; font-size:clamp(40px, 12vw, 58px); white-space:nowrap}
.monto .cur{font-size:.42em; font-weight:700; letter-spacing:0; margin-right:.2em; vertical-align:.95em}
.monto .dec{font-size:.42em; font-weight:700; letter-spacing:0; vertical-align:.95em}
.monto.neg{color:var(--crit-text)}
.billete .de{margin-top:6px; font-size:14px; opacity:.85}
.medidor{margin-top:16px; height:8px; border-radius:4px; background:color-mix(in srgb, var(--billete-ink) 12%, transparent); display:flex; gap:2px; overflow:hidden}
.medidor i{display:block; height:100%; transition:width .7s cubic-bezier(.2,.8,.2,1)}
.medidor .g{background:var(--billete-ink)}
.medidor .a{background:var(--sol)}
.billete .stats{display:grid; grid-template-columns:repeat(3,1fr); margin:16px -18px 0; border-top:1px solid color-mix(in srgb, var(--billete-ink) 14%, transparent)}
.billete .stats div{padding:11px 12px 13px 18px; min-width:0}
.billete .stats div+div{border-left:1px solid color-mix(in srgb, var(--billete-ink) 14%, transparent); padding-left:12px}
.billete .stats small{display:block; font-size:11.5px; opacity:.75}
.billete .stats b{font-family:var(--f-display); font-stretch:110%; font-weight:750; font-size:17px; white-space:nowrap}

/* ---------- estado ---------- */
.estado{display:flex; gap:10px; align-items:flex-start; margin-block:14px 4px; padding:12px 14px; background:var(--card); border-radius:var(--r-m); border:1px solid var(--line)}
.estado p{margin:0; font-size:14px; color:var(--ink-2)}
.estado p b{color:var(--ink)}
.pill{display:inline-flex; align-items:center; gap:6px; flex:none; font-size:12px; font-weight:600; padding:4px 9px 4px 7px; border-radius:999px; background:var(--paper); border:1px solid var(--line); white-space:nowrap}
.pill svg{width:14px; height:14px}
.pill.bien svg{color:var(--good)} .pill.ojo svg{color:var(--warn)} .pill.alerta svg{color:var(--crit)}

/* ---------- secciones ---------- */
.sec{margin-top:26px}
.sec-h{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:10px}
.sec-h h2{margin:0; font-family:var(--f-display); font-stretch:112%; font-weight:750; font-size:18px; letter-spacing:-.01em}
.link{background:none; border:0; padding:4px 0; color:var(--tinta); font-weight:600; font-size:14px}
.sub{margin:2px 0 0; color:var(--muted); font-size:13px}

/* sobres */
.sobres{display:grid; gap:8px}
.sobre{display:grid; grid-template-columns:1fr auto; gap:6px 12px; align-items:baseline; padding:12px 14px 13px; background:var(--card); border:1px solid var(--line); border-radius:var(--r-m); position:relative}
.sobre::before{content:""; position:absolute; top:-1px; left:14px; width:28px; height:9px; border:1px solid var(--line); border-top:0; border-radius:0 0 14px 14px; background:var(--paper)}
.sobre .nom{font-weight:600; min-width:0}
.sobre .nom small{display:block; font-weight:400; font-size:12px; color:var(--muted)}
.sobre .val{font-family:var(--f-mono); font-size:13px; text-align:right; white-space:nowrap}
.sobre .val small{display:block; font-family:var(--f-body); font-size:12px; color:var(--muted)}
.sobre .val .over{color:var(--crit-text); font-weight:600}
.meter{grid-column:1/-1; height:6px; border-radius:3px; background:var(--tinta-soft); overflow:hidden}
.meter i{display:block; height:100%; border-radius:3px; background:var(--tinta); transition:width .6s cubic-bezier(.2,.8,.2,1)}
.meter.warn{background:color-mix(in srgb, var(--warn) 22%, transparent)} .meter.warn i{background:var(--warn)}
.meter.crit{background:color-mix(in srgb, var(--crit) 20%, transparent)} .meter.crit i{background:var(--crit)}

/* teaser recomendaciones */
.teaser{display:flex; gap:14px; align-items:center; width:100%; text-align:left; padding:14px; border-radius:var(--r-m); border:1px solid var(--line); background:var(--card); margin-top:12px}
.teaser .num{flex:none; width:44px; height:44px; border-radius:50%; display:grid; place-items:center; background:var(--sol); color:var(--sol-ink); font-family:var(--f-display); font-stretch:125%; font-weight:850; font-size:18px; box-shadow:inset 0 0 0 3px var(--sol-hi), inset 0 0 0 4px color-mix(in srgb,var(--sol-ink) 25%, transparent)}
.teaser b{display:block}
.teaser span{font-size:13px; color:var(--muted)}
.teaser svg{flex:none; margin-left:auto; width:18px; height:18px; color:var(--muted)}

/* ---------- boleta ---------- */
.filtros{display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; margin-bottom:12px; scrollbar-width:none}
.chip{flex:none; border:1px solid var(--line); background:var(--card); border-radius:999px; padding:7px 13px; font-size:13.5px; font-weight:500; color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.boleta{background:var(--card); padding:22px 16px 26px; filter:drop-shadow(0 6px 14px rgba(0,0,0,.08));
  -webkit-mask:radial-gradient(circle at 7px 0, transparent 5px, #000 5.5px) top left/14px 51% repeat-x, radial-gradient(circle at 7px 100%, transparent 5px, #000 5.5px) bottom left/14px 51% repeat-x;
  mask:radial-gradient(circle at 7px 0, transparent 5px, #000 5.5px) top left/14px 51% repeat-x, radial-gradient(circle at 7px 100%, transparent 5px, #000 5.5px) bottom left/14px 51% repeat-x}
.boleta-h{text-align:center; font-family:var(--f-mono); font-size:11.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); padding-bottom:12px; border-bottom:1px dashed var(--line-2)}
.boleta-h b{display:block; font-family:var(--f-display); font-stretch:125%; letter-spacing:-.01em; text-transform:none; font-size:20px; color:var(--ink); font-weight:850}
.dia{padding-block:12px 4px; border-bottom:1px dashed var(--line-2)}
.dia-h{display:flex; justify-content:space-between; font-family:var(--f-mono); font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-bottom:4px}
.mov{display:grid; grid-template-columns:10px 1fr auto; gap:10px; align-items:center; width:100%; text-align:left; background:none; border:0; padding:8px 0; border-radius:6px}
.mov:hover{background:color-mix(in srgb, var(--ink) 4%, transparent)}
.mov .dot{width:10px; height:10px; border-radius:3px}
.mov .txt{min-width:0}
.mov .txt b{display:block; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.mov .txt small{color:var(--muted); font-size:12px}
.mov .amt{font-family:var(--f-mono); font-size:14px; white-space:nowrap; font-variant-numeric:tabular-nums}
.mov .amt.in{color:var(--good-text)}
.total{display:flex; justify-content:space-between; padding-top:14px; font-family:var(--f-mono); font-size:13px; text-transform:uppercase; letter-spacing:.06em}
.total b{font-size:15px}
.vacio{padding:28px 12px; text-align:center; color:var(--muted)}
.vacio b{display:block; color:var(--ink); font-size:16px; margin-bottom:4px}

/* ---------- análisis ---------- */
.tiles{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.tile{padding:13px 14px; background:var(--card); border:1px solid var(--line); border-radius:var(--r-m); min-width:0}
.tile small{display:block; color:var(--muted); font-size:12.5px}
.tile b{display:block; font-family:var(--f-display); font-stretch:110%; font-weight:750; font-size:22px; letter-spacing:-.01em; margin-top:2px; white-space:nowrap}
.tile span{font-size:12px; color:var(--ink-2)}
.panel{background:var(--card); border:1px solid var(--line); border-radius:var(--r-m); padding:16px 14px; margin-top:10px}
.panel h3{margin:0; font-family:var(--f-display); font-stretch:112%; font-weight:750; font-size:16px}
.leyenda{display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:10px; font-size:12.5px; color:var(--ink-2)}
.leyenda span{display:inline-flex; align-items:center; gap:6px}
.key-line{width:16px; height:0; border-top:2px solid; display:inline-block}
.key-sw{width:10px; height:10px; border-radius:3px; display:inline-block}
.chart{position:relative; margin-top:6px; min-height:190px}
.chart svg{display:block; width:100%; height:auto; overflow:visible}
.chart text{fill:var(--muted); font-family:var(--f-body); font-size:11px}
.chart .grid{stroke:var(--line); stroke-width:1}
.chart .base{stroke:var(--line-2); stroke-width:1}
.chart .ln-real{stroke:var(--tinta); stroke-width:2; fill:none; stroke-linejoin:round; stroke-linecap:round}
.chart .ar-real{fill:var(--tinta); opacity:.1}
.chart .ln-proy{stroke:var(--tinta); stroke-width:2; fill:none; stroke-dasharray:4 4; opacity:.55}
.chart .ln-ideal{stroke:var(--muted); stroke-width:1.5; fill:none}
.chart .pt{fill:var(--tinta); stroke:var(--card); stroke-width:2}
.chart .lbl-strong{fill:var(--ink); font-weight:600; font-size:12px}
.chart .cross{stroke:var(--line-2); stroke-width:1}
.caption{margin:8px 0 0; font-size:13.5px; color:var(--ink-2)}
details.tabla{margin-top:10px; font-size:13px}
details.tabla summary{cursor:pointer; color:var(--tinta); font-weight:600}
.tbl-wrap{overflow-x:auto; margin-top:8px}
table{border-collapse:collapse; width:100%; font-size:13px}
th,td{padding:6px 8px; text-align:right; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums; white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-weight:600; color:var(--muted); font-size:12px}

.stack{display:flex; gap:2px; height:22px; margin-top:16px; border-radius:4px; overflow:hidden}
.stack i{display:block; height:100%; min-width:2px}
.stack .t{background:var(--s-track)}
.marcas{position:relative; height:22px; font-size:11px; color:var(--muted)}
.marcas span{position:absolute; top:3px; transform:translateX(-50%); white-space:nowrap}
.marcas span::before{content:""; position:absolute; left:50%; top:-29px; height:26px; border-left:1.5px solid var(--ink); opacity:.55}
.g-rows{display:grid; gap:0; margin-top:6px}
.g-row{display:grid; grid-template-columns:12px 1fr auto auto; gap:10px; align-items:center; padding:9px 0; border-top:1px solid var(--line); font-size:14px}
.g-row .real{font-family:var(--f-mono); font-size:13px; text-align:right; white-space:nowrap}
.g-row .meta{font-size:12px; color:var(--muted); min-width:66px; text-align:right}
.g-row .flag{color:var(--crit-text); font-weight:600}
.g-row .okf{color:var(--good-text); font-weight:600}

.cat-rows{display:grid; gap:12px; margin-top:12px}
.cat-row{display:grid; grid-template-columns:1fr auto; gap:5px 10px; font-size:14px}
.cat-row .n{min-width:0; display:flex; gap:8px; align-items:center}
.cat-row .v{font-family:var(--f-mono); font-size:13px; text-align:right; white-space:nowrap}
.cat-row .bar{grid-column:1/-1; position:relative; height:12px}
.cat-row .bar i{position:absolute; left:0; top:0; height:100%; border-radius:0 4px 4px 0}
.cat-row .bar u{position:absolute; top:-3px; height:18px; border-left:2px solid var(--ink); opacity:.6}
.cat-row .nota{grid-column:1/-1; font-size:12px; color:var(--muted); display:flex; gap:10px; flex-wrap:wrap}
.cat-row .nota .over{color:var(--crit-text); font-weight:600}

.pago-rows{display:grid; gap:10px; margin-top:12px}
.pago-row{display:grid; grid-template-columns:96px 1fr auto; gap:10px; align-items:center; font-size:14px}
.pago-row .bar{height:10px; background:var(--s-track); border-radius:0 4px 4px 0; overflow:hidden}
.pago-row .bar i{display:block; height:100%; background:var(--tinta); border-radius:0 4px 4px 0}
.pago-row .v{font-family:var(--f-mono); font-size:13px; white-space:nowrap}

.recos{display:grid; gap:8px; margin-top:12px}
.reco{display:grid; grid-template-columns:22px 1fr; gap:4px 10px; padding:12px 0; border-top:1px solid var(--line)}
.reco:first-child{border-top:0}
.reco svg{width:20px; height:20px; margin-top:1px}
.reco.alerta svg{color:var(--crit)} .reco.ojo svg{color:var(--warn)} .reco.bien svg{color:var(--good)} .reco.ia svg{color:var(--sol)}
.reco b{display:block; font-weight:600; text-wrap:balance}
.reco p{grid-column:2; margin:0; font-size:14px; color:var(--ink-2)}
.reco .ahorra{grid-column:2; font-family:var(--f-mono); font-size:12px; color:var(--good-text); margin-top:2px}
.claude{margin-top:14px; padding:14px; border-radius:var(--r-m); background:var(--paper); border:1px solid var(--line)}
.claude-h{display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap}
.claude-h p{margin:0; font-size:13.5px; color:var(--ink-2); flex:1 1 220px}
.pensando{display:flex; align-items:center; gap:10px; margin-top:12px; font-size:14px; color:var(--ink-2)}
.coin-spin{width:18px; height:18px; border-radius:50%; background:var(--sol); box-shadow:inset 0 0 0 2px var(--sol-hi); animation:flip 1.1s ease-in-out infinite}
@keyframes flip{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.12)}}
.letra-chica{font-size:12px; color:var(--muted); margin:10px 0 0}

/* ---------- metas ---------- */
.metas{display:grid; gap:10px}
.alcancia{padding:16px 14px; background:var(--card); border:1px solid var(--line); border-radius:var(--r-m); display:grid; gap:8px}
.alcancia .h{display:flex; justify-content:space-between; align-items:baseline; gap:10px}
.alcancia .h b{font-size:16px; font-weight:600; min-width:0}
.alcancia .h span{font-family:var(--f-mono); font-size:13px; white-space:nowrap}
.alcancia .meter{background:color-mix(in srgb, var(--s-aho) 18%, transparent); height:10px; border-radius:5px}
.alcancia .meter i{background:var(--s-aho); border-radius:5px}
.alcancia p{margin:0; font-size:13.5px; color:var(--ink-2)}
.alcancia .acc{display:flex; gap:8px; margin-top:4px}
.sugerida{border-style:dashed; background:transparent}

/* ---------- botones ---------- */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border-radius:12px; padding:12px 16px; font-weight:600; border:1px solid var(--line-2); background:var(--card)}
.btn:hover{border-color:var(--ink-2)}
.btn-p{background:var(--tinta); color:var(--tinta-ink); border-color:var(--tinta)}
.btn-p:hover{filter:brightness(1.08); border-color:var(--tinta)}
.btn-sm{padding:7px 12px; font-size:13.5px; border-radius:10px}
.btn-peligro{color:var(--crit-text); border-color:color-mix(in srgb, var(--crit) 45%, transparent)}
.btn-full{width:100%}
.btn:disabled{opacity:.5; cursor:default}

/* ---------- barra inferior ---------- */

<script>
"use strict";
/* ============ utilidades ============ */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const nf2 = new Intl.NumberFormat("es-PE", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const nf0 = new Intl.NumberFormat("es-PE", { maximumFractionDigits: 0 });
const sol = n => (n < -0.004 ? "−" : "") + "S/ " + nf2.format(Math.abs(n));
const sol0 = n => (Math.round(n) < 0 ? "−" : "") + "S/ " + nf0.format(Math.abs(Math.round(n)));
const pct = (n, d = 0) => (isFinite(n) ? (n * 100).toFixed(d) : "0") + "%";
const suma = (arr, f = x => x.m) => arr.reduce((a, x) => a + (+f(x) || 0), 0);
const r2 = n => Math.round(n * 100) / 100;
const nuevoId = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","setiembre","octubre","noviembre","diciembre"];
const MES_C = ["ene","feb","mar","abr","may","jun","jul","ago","set","oct","nov","dic"];
const DIAS_C = ["dom","lun","mar","mié","jue","vie","sáb"];
const pad = n => String(n).padStart(2, "0");
const ymOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
const isoOf = d => `${ymOf(d)}-${pad(d.getDate())}`;
const HOY = new Date();
const HOY_YM = ymOf(HOY);
const HOY_ISO = isoOf(HOY);
const diasEnMes = ym => { const [y, m] = ym.split("-").map(Number); return new Date(y, m, 0).getDate(); };
const ymAdd = (ym, k) => { const [y, m] = ym.split("-").map(Number); return ymOf(new Date(y, m - 1 + k, 1)); };
const fechaDe = iso => { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d); };
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ============ catálogo ============ */
const GRUPOS = {
  nec: { n: "Necesidades", color: "var(--s-nec)", meta: 0.5 },
  gus: { n: "Gustos", color: "var(--s-gus)", meta: 0.3 },
  aho: { n: "Ahorro", color: "var(--s-aho)", meta: 0.2 },
};
const CATS = [
  { id: "vivienda", n: "Vivienda", g: "nec", fijo: true, h: "Alquiler, mantenimiento" },
  { id: "servicios", n: "Servicios", g: "nec", fijo: true, h: "Luz, agua, internet, celular" },

  { id: "comida", n: "Comida fuera", g: "gus", h: "Menú, delivery, cafés" },
  { id: "salidas", n: "Salidas", g: "gus", h: "Juntadas, cine, tragos" },
  { id: "ropa", n: "Ropa y compras", g: "gus", h: "Ropa, tecnología, casa" },
  { id: "suscripciones", n: "Suscripciones", g: "gus", fijo: true, h: "Streaming, apps, gimnasio" },
  { id: "otros", n: "Otros", g: "gus", h: "Lo que no encaja" },
];
const CAT = Object.fromEntries(CATS.map(c => [c.id, c]));
const INGRESOS = [
  { id: "cachuelo", n: "Cachuelo" },
  { id: "gratificacion", n: "Gratificación o bono" },
  { id: "reembolso", n: "Reembolso" },
  { id: "otro-ingreso", n: "Otro ingreso" },
];
const PAGOS = [
  { id: "efectivo", n: "Efectivo" },
  { id: "yape", n: "Yape / Plin" },
  { id: "debito", n: "Débito" },
  { id: "credito", n: "Crédito" },
];
const PAGO = Object.fromEntries(PAGOS.map(p => [p.id, p]));
const PESOS = { vivienda: .40, servicios: .12, mercado: .25, transporte: .12, salud: .05, educacion: .03, deudas: .03, comida: .35, salidas: .20, ropa: .15, suscripciones: .15, otros: .15 };
const CONSEJOS = {
  comida: "Fija dos o tres días de táper a la semana. Un menú cuesta entre S/ 12 y S/ 15, y la misma porción hecha en casa sale cerca de la mitad.",
  salidas: "Ponle un monto semanal a las salidas y sepáralo el lunes. Cuando se acaba, se acaba hasta la otra semana.",
  ropa: "Antes de una compra que no estaba en el plan, espera 48 horas. Si después de eso todavía la quieres, cómprala.",
  suscripciones: "Revisa cuáles usaste este mes. Cancelar una sola de S/ 35 son S/ 420 al año.",
  transporte: "Mira los trayectos que repites en taxi: si alguno se puede hacer en metro o combi, ahí está el ahorro.",
  mercado: "Haz lista y compra por semana, no por día. Las compras sueltas en la bodega suman más de lo que parece.",
  servicios: "Revisa tu plan de celular e internet. Muchas veces pagas por más datos o velocidad de la que usas.",
  vivienda: "Si la vivienda pasa del 35% de tu sueldo, todo lo demás se aprieta. Tenlo en cuenta en tu próxima renovación.",
  salud: "La salud no se recorta, pero sí conviene un pequeño fondo aparte para imprevistos médicos.",
  educacion: "Si es un gasto puntual del mes, súbele el sobre en Ajustes para que tu presupuesto sea realista.",
  deudas: "Si tienes varias deudas, paga primero la de interés más alto y en las demás cubre solo la cuota.",
  otros: "Mucho en «Otros» suele ser gasto hormiga. Clasifícalo bien para ver a dónde se va.",
};

function presupuestoBase(sueldo, ahorroPct) {
  const nec = sueldo * 0.5;
  const gus = sueldo * Math.max(0, 0.5 - ahorroPct / 100);
  const out = {};
  for (const c of CATS) out[c.id] = Math.round(((c.g === "nec" ? nec : gus) * PESOS[c.id]) / 10) * 10;
  return out;
}

/* ============ datos de ejemplo ============ */
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function demoMes(ym, hasta, seed) {
  const r = rng(seed); const L = []; const dm = diasEnMes(ym); const [y, m] = ym.split("-").map(Number);
  const add = (d, t, monto, c, n, p) => { if (d <= hasta && d <= dm) L.push({ id: "ej" + seed + "-" + L.length, t, m: r2(monto), c, n, f: `${ym}-${pad(d)}`, p }); };
  add(1, "g", 750, "vivienda", "Alquiler del depa", "debito");
  add(1, "a", 250, "emergencia", "Págate primero", "debito");
  add(3, "g", 109, "servicios", "Internet y celular", "debito");
  add(5, "g", 99, "suscripciones", "Gimnasio", "credito");
  add(6, "g", 35.9, "suscripciones", "Streaming", "credito");
  add(9, "g", 68.4, "servicios", "Luz", "yape");
  add(11, "g", 34.9, "servicios", "Agua", "yape");
  for (let d = 1; d <= dm; d++) {
    const dow = new Date(y, m - 1, d).getDay();
    if (dow >= 1 && dow <= 5) {
      if (r() < .85) add(d, "g", [5, 5.5, 6][Math.floor(r() * 3)], "transporte", "Combi y metro", "efectivo");
      if (r() < .6) add(d, "g", 12 + Math.floor(r() * 4), "comida", "Menú", "yape");
      if (r() < .3) add(d, "g", 7 + Math.floor(r() * 7), "comida", "Café", "yape");
    }
    if (dow === 6) {
      add(d, "g", 115 + r() * 55, "mercado", "Mercado de la semana", "efectivo");
      if (r() < .65) add(d, "g", 45 + r() * 70, "salidas", "Salida con amigos", "credito");
    }
    if (dow === 0 && r() < .7) add(d, "g", 32 + r() * 22, "comida", "Delivery", "credito");
    if (r() < .14) add(d, "g", 3 + r() * 8, "otros", "Bodega", "efectivo");
  }
  add(13, "g", 22, "transporte", "Taxi de regreso", "yape");
  add(15, "g", 139.9, "ropa", "Zapatillas", "credito");
  add(17, "i", 350, "cachuelo", "Cachuelo de diseño", "yape");
  add(19, "g", 46.5, "salud", "Farmacia", "debito");
  add(21, "g", 18, "transporte", "Taxi", "yape");
  add(24, "g", 120, "deudas", "Cuota de la tarjeta", "debito");
  add(26, "a", 100, "viaje", "Para Cusco", "yape");
  return L.sort((a, b) => a.f.localeCompare(b.f));
}
function cargarDemo() {
  S.mode = "demo";
  S.perfil = { sueldo: 3000, diaPago: 30, ahorroPct: 20, meses: [],
    presupuestos: { vivienda: 750, servicios: 220, mercado: 480, transporte: 180, salud: 50, educacion: 0, deudas: 120, comida: 200, salidas: 120, ropa: 60, suscripciones: 140, otros: 40 } };
  S.metas = [
    { id: "emergencia", n: "Fondo de emergencia", obj: 6000, ah: 1850, fecha: "" },
    { id: "viaje", n: "Viaje a Cusco", obj: 1500, ah: 420, fecha: ymAdd(HOY_YM, 5) + "-01" },
  ];
  S.meses = {};
  S.meses[HOY_YM] = demoMes(HOY_YM, HOY.getDate(), 7);
  S.meses[ymAdd(HOY_YM, -1)] = demoMes(ymAdd(HOY_YM, -1), 31, 3);
}

/* ============ almacenamiento ============ */
const Store = {
  kind: "cargando", db: null, uid: null, pend: {}, busy: {}, error: null,
  lsOk() { try { localStorage.setItem("sencillo:t", "1"); localStorage.removeItem("sencillo:t"); return true; } catch (e) { return false; } },
  lsGet(k) { try { const v = localStorage.getItem("sencillo:" + k); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
  lsSet(k, v) { try { localStorage.setItem("sencillo:" + k, JSON.stringify(v)); } catch (e) {} },
  lsDel(k) { try { localStorage.removeItem("sencillo:" + k); } catch (e) {} },
  path(k) { return `data/users/${this.uid}/${k}`; },
  async conectar() {
    try {
      if (window.claude && typeof window.claude.use === "function") {
        const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
        if (db && user) {
          const id = await user.id();
          if (id) { this.db = db; this.uid = id; this.kind = "db"; return; }
        }
      }
    } catch (e) {}
    this.kind = this.lsOk() ? "local" : "ninguno";
  },
  async leer(k) {
    if (this.kind === "db") {
      try {
        const s = await this.db.doc(this.path(k)).get();
        const d = s.exists ? s.data() : null;
        if (d) this.lsSet(k, d);
        return d;
      } catch (e) { return this.lsGet(k); }
    }
    return this.lsGet(k);
  },
  guardar(k, v) {
    const copia = JSON.parse(JSON.stringify(v));
    this.lsSet(k, copia);
    if (this.kind !== "db") return;
    this.pend[k] = copia;
    this.flush(k);
  },
  async borrar(k) {
    this.lsDel(k);
    if (this.kind === "db") { try { await this.db.doc(this.path(k)).delete(); } catch (e) {} }
  },
  async flush(k) {
    if (this.busy[k]) return;
    this.busy[k] = true;
    try {
      while (this.pend[k]) {
        const v = this.pend[k]; this.pend[k] = null;
        try { await this.db.doc(this.path(k)).set(v); this.error = null; }
        catch (e) {
          if (e && e.code === "unavailable") {
            await new Promise(r => setTimeout(r, 700 + Math.random() * 900));
            try { await this.db.doc(this.path(k)).set(v); this.error = null; continue; } catch (e2) {}
          }
          this.error = (e && e.code) || "error";
          toast("No se pudo guardar en tu cuenta. Quedó guardado en este navegador.");
        }
      }
    } finally { this.busy[k] = false; }
  },
};

};

/* ============ análisis ============ */
function analizar(ym) {
  const p = S.perfil; const movs = S.meses[ym] || [];
  const dm = diasEnMes(ym);
  const dia = ym === HOY_YM ? HOY.getDate() : (ym < HOY_YM ? dm : 0);
  const gastos = movs.filter(x => x.t === "g");
  const extra = suma(movs.filter(x => x.t === "i"));
  const ingreso = p.sueldo + extra;
  const gastado = suma(gastos);
  const ahorrado = suma(movs.filter(x => x.t === "a"));
  const disponible = ingreso - gastado - ahorrado;
  const porCat = Object.fromEntries(CATS.map(c => [c.id, 0]));
  for (const g of gastos) porCat[g.c] = (porCat[g.c] || 0) + g.m;
  const nec = suma(CATS.filter(c => c.g === "nec"), c => porCat[c.id]);
  const gus = suma(CATS.filter(c => c.g === "gus"), c => porCat[c.id]);
  const fijos = suma(CATS.filter(c => c.fijo), c => porCat[c.id]);
  const variables = gastado - fijos;
  const proy = dia > 0 ? fijos + (variables / dia) * dm : 0;
  const limiteGasto = ingreso * (1 - p.ahorroPct / 100);
  const diasRest = ym === HOY_YM ? dm - dia + 1 : (ym > HOY_YM ? dm : 0);
  const margen = limiteGasto - gastado;
  const porDia = diasRest > 0 ? Math.max(0, margen) / diasRest : 0;
  const acum = new Array(dm + 1).fill(0);
  for (const g of gastos) { const d = +g.f.slice(8, 10); if (d >= 1 && d <= dm) acum[d] += g.m; }
  for (let d = 1; d <= dm; d++) acum[d] += acum[d - 1];
  const hormiga = gastos.filter(g => g.m <= 15 && CAT[g.c]?.g === "gus" && !CAT[g.c].fijo);
  const porPago = Object.fromEntries(PAGOS.map(x => [x.id, 0]));
  for (const g of gastos) porPago[g.p || "efectivo"] = (porPago[g.p || "efectivo"] || 0) + g.m;
  const prev = S.meses[ymAdd(ym, -1)];
  let porCatPrev = null;
  if (prev && prev.length) { porCatPrev = Object.fromEntries(CATS.map(c => [c.id, 0])); for (const g of prev) if (g.t === "g") porCatPrev[g.c] = (porCatPrev[g.c] || 0) + g.m; }
  return { ym, dm, dia, movs, gastos, extra, ingreso, gastado, ahorrado, disponible, porCat, nec, gus, fijos, variables, proy, limiteGasto, diasRest, margen, porDia, acum, hormiga, porPago, porCatPrev, tasaAhorro: ingreso > 0 ? ahorrado / ingreso : 0 };
}

function estadoMes(A) {
  if (A.dia === 0) return { nivel: "bien", txt: "Mes por empezar", det: "Cuando llegue el mes, aquí verás cómo vas." };
  if (A.disponible < 0) return { nivel: "alerta", txt: "Te pasaste", det: `Llevas <b>${sol0(-A.disponible)}</b> por encima de lo que entró este mes.` };
  if (A.ym !== HOY_YM) {
    return A.margen >= 0
      ? { nivel: "bien", txt: "Mes cerrado", det: `Cerraste ahorrando <b>${pct(A.tasaAhorro)}</b> de tus ingresos.` }
      : { nivel: "ojo", txt: "Mes cerrado", det: `Gastaste <b>${sol0(-A.margen)}</b> más de lo planeado.` };
  }
  if (A.proy > A.limiteGasto * 1.03) return { nivel: "ojo", txt: "Ojo con el ritmo", det: `Si sigues así, gastarías <b>${sol0(A.proy)}</b> y tu límite es ${sol0(A.limiteGasto)}.` };
  return { nivel: "bien", txt: "Vas bien", det: `A este ritmo cierras con <b>${sol0(Math.max(0, A.limiteGasto - A.proy))}</b> de margen, además de lo que ahorraste.` };
}

function recomendar(A) {
  const p = S.perfil; const R = [];
  if (A.dia === 0 || A.gastos.length < 3) return R;
  const actual = A.ym === HOY_YM;
  const factor = actual ? A.dm / A.dia : 1;
  // 1. ritmo
  if (actual && A.proy > A.limiteGasto * 1.02) {
    R.push({ nivel: "alerta", t: `A este ritmo gastarías ${sol0(A.proy)} este mes`, d: `Son ${sol0(A.proy - A.limiteGasto)} más de lo que te permite tu meta de ahorro del ${p.ahorroPct}%. Para cerrar bien, trata de no pasar de ${sol0(A.porDia)} por día los ${A.diasRest} días que quedan.`, ah: A.proy - A.limiteGasto });
  } else if (!actual && A.margen < 0) {
    R.push({ nivel: "alerta", t: `Gastaste ${sol0(-A.margen)} más de lo planeado`, d: `Tu límite era ${sol0(A.limiteGasto)} para cumplir el ${p.ahorroPct}% de ahorro. Revisa abajo qué sobres se pasaron y ajusta esos primero el próximo mes.` });
  }
  // 2. sobres pasados o en camino
  const cats = CATS.map(c => { const b = p.presupuestos[c.id] || 0; const s = A.porCat[c.id] || 0; const proyC = c.fijo ? s : s * factor; return { c, b, s, proyC }; }).filter(x => x.b > 0);
  const pasados = cats.filter(x => x.s > x.b).sort((a, b) => (b.s - b.b) - (a.s - a.b)).slice(0, 2);
  for (const x of pasados) R.push({ nivel: x.s > x.b * 1.2 ? "alerta" : "ojo", t: `${x.c.n} se pasó de su sobre por ${sol0(x.s - x.b)}`, d: CONSEJOS[x.c.id], ah: x.s - x.b });
  if (actual) {
    const camino = cats.filter(x => x.s <= x.b && x.proyC > x.b * 1.1 && !x.c.fijo).sort((a, b) => (b.proyC - b.b) - (a.proyC - a.b)).slice(0, 1);
    for (const x of camino) R.push({ nivel: "ojo", t: `${x.c.n} va camino a pasarse`, d: `Llevas ${sol0(x.s)} de ${sol0(x.b)} y faltan ${A.diasRest} días. A este paso terminarías en ${sol0(x.proyC)}. ${CONSEJOS[x.c.id]}`, ah: x.proyC - x.b });
  }
  // 3. hormiga
  const hT = suma(A.hormiga);
  if (A.hormiga.length >= 8 && hT >= A.gastado * 0.06) {
    const top = {}; for (const h of A.hormiga) top[h.c] = (top[h.c] || 0) + h.m;
    const nombres = Object.entries(top).sort((a, b) => b[1] - a[1]).slice(0, 2).map(([c]) => CAT[c]?.n.toLowerCase());
    R.push({ nivel: "ojo", t: `${A.hormiga.length} gastos hormiga suman ${sol0(hT)}`, d: `Son compras chicas de S/ 15 o menos, sobre todo en ${nombres.join(" y ")}.${actual ? ` Proyectado al mes completo serían ${sol0(hT * factor)}.` : ""} Recortar uno de cada tres te deja unos ${sol0(hT * factor / 3)} al mes.`, ah: hT * factor / 3 });
  }
  // 4. ahorro
  const meta = p.ahorroPct / 100;
  if (A.tasaAhorro < meta * 0.5) {
    R.push({ nivel: A.tasaAhorro < 0.05 ? "alerta" : "ojo", t: `Llevas ahorrado ${pct(A.tasaAhorro)} de tus ingresos`, d: `Tu meta es ${p.ahorroPct}%. Lo más efectivo es apartar ${sol0(A.ingreso * meta)} apenas te pagan (día ${p.diaPago}) y vivir con el resto. Lo que se aparta primero no se gasta.` });
  } else if (A.tasaAhorro < meta) {
    R.push({ nivel: "ojo", t: `Te faltan ${sol0(A.ingreso * meta - A.ahorrado)} para tu meta de ahorro`, d: `Llevas ${pct(A.tasaAhorro)} de ${p.ahorroPct}%. ${actual ? `Si separas eso hoy, lo que queda (${sol0(Math.max(0, A.disponible - (A.ingreso * meta - A.ahorrado)))}) es lo que tienes para el resto del mes.` : "El próximo mes apártalo el mismo día que te pagan."}` });
  } else {
    R.push({ nivel: "bien", t: `Ya cumpliste tu meta de ahorro del ${p.ahorroPct}%`, d: `Apartaste ${sol0(A.ahorrado)} este mes. Si te sobra algo al cierre, mándalo a la meta que tengas más cerca.` });
  }
  // 5. crédito
  const cred = A.porPago.credito || 0;
  if (A.gastado > 0 && cred / A.gastado > 0.3) R.push({ nivel: "ojo", t: `${pct(cred / A.gastado)} de tus gastos fueron con tarjeta de crédito`, d: `Son ${sol0(cred)}. Asegúrate de pagar el total del estado de cuenta, no el mínimo: los intereses de las tarjetas de consumo pueden pasar del 50% anual.` });
  // 6. 50/30/20
  if (A.ingreso > 0 && A.gus / A.ingreso > (1 - 0.5 - meta) + 0.05) R.push({ nivel: "ojo", t: `Tus gustos se llevan ${pct(A.gus / A.ingreso)} de tus ingresos`, d: `Para ahorrar tu ${p.ahorroPct}%, los gustos deberían quedarse cerca de ${pct(1 - 0.5 - meta)} (${sol0(A.ingreso * (1 - 0.5 - meta))}). Elige uno o dos que de verdad disfrutes y recorta el resto.` });
  if (A.ingreso > 0 && A.nec / A.ingreso > 0.6) R.push({ nivel: "ojo", t: `Las necesidades ocupan ${pct(A.nec / A.ingreso)} de tus ingresos`, d: "Cuando lo básico pasa del 60%, el margen para ahorrar es muy chico. Revisa los gastos fijos que se pueden negociar o cambiar, como plan de celular, internet o alquiler." });
  // 7. comparación con mes anterior
  if (A.porCatPrev && !actual) {
    const subidas = CATS.map(c => ({ c, d: (A.porCat[c.id] || 0) - (A.porCatPrev[c.id] || 0), base: A.porCatPrev[c.id] || 0 })).filter(x => x.d > 50 && x.base > 0 && x.d / x.base > .3).sort((a, b) => b.d - a.d);
    if (subidas[0]) R.push({ nivel: "ojo", t: `${subidas[0].c.n} subió ${sol0(subidas[0].d)} frente al mes anterior`, d: `Pasó de ${sol0(subidas[0].base)} a ${sol0(A.porCat[subidas[0].c.id])}. Si fue algo puntual, está bien. Si se repite, súbele el sobre o recórtalo.` });
  }
  // 8. fondo de emergencia
  if (!S.metas.some(m => /emergencia/i.test(m.n))) R.push({ nivel: "ojo", t: "Todavía no tienes un fondo de emergencia", d: `Apunta a cubrir 3 meses de gastos básicos: unos ${sol0(fondoSugerido())}. Créalo en Metas y aporta aunque sea poco cada mes.` });
  // 9. cachuelo
  if (A.extra > 0) R.push({ nivel: "bien", t: `Este mes entraron ${sol0(A.extra)} extra`, d: `Si mandas la mitad (${sol0(A.extra / 2)}) a tus metas, avanzas sin tocar tu presupuesto normal.` });
  const orden = { alerta: 0, ojo: 1, bien: 2 };
  return R.sort((a, b) => orden[a.nivel] - orden[b.nivel]).slice(0, 6);
}
function fondoSugerido() {
  const p = S.perfil; const b = p.presupuestos;
  const basicos = suma(CATS.filter(c => c.g === "nec"), c => b[c.id] || 0);
  return Math.round((basicos || p.sueldo * 0.5) * 3 / 100) * 100;
}

/* ============ render ============ */
function render() {
  const ym = S.ym; const [y, m] = ym.split("-").map(Number);
  $("#titulo-mes").innerHTML = `${MESES[m - 1]} <span>${y}</span>`;
  $("#btn-next").disabled = ym >= ymAdd(HOY_YM, 1);
  $$(".tab").forEach(b => b.dataset.tab === S.tab ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  $("#hdr-modo").textContent = S.mode === "demo" ? "ejemplo" : "tu mes en soles";
  renderAviso();
  const A = analizar(ym);
  const v = $("#vista");
  if (S.tab === "mes") v.innerHTML = vistaMes(A);
  else if (S.tab === "movs") v.innerHTML = vistaMovs(A);
  else if (S.tab === "analisis") v.innerHTML = vistaAnalisis(A);
  else v.innerHTML = vistaMetas(A);
  if (S.tab === "mes") requestAnimationFrame(dibujarBillete);
  if (S.tab === "analisis") requestAnimationFrame(() => chartRitmo(A));
}
function renderAviso() {
  const el = $("#aviso");
  if (S.mode === "demo") {
    el.innerHTML = `<div class="aviso"><span>${S.cargando ? "Abriendo tus datos… Mientras tanto, este es un <b>mes de ejemplo</b>." : "Estás viendo un <b>mes de ejemplo</b> con un sueldo de ${sol0(S.perfil.sueldo)}. Lo que anotes aquí no se guarda."}</span><button class="btn btn-p btn-sm" data-act="empezar">Empezar con mis números</button></div>`;
  } else if (Store.kind === "local" && !S.cargando) {
    el.innerHTML = `<div class="aviso"><span>Tus datos se guardan <b>solo en este navegador</b>. Inicia sesión en Claude para tenerlos en todos tus dispositivos.</span></div>`;
  } else el.innerHTML = "";
}

function vistaMes(A) {
  const p = S.perfil; const [, m] = A.ym.split("-").map(Number);
  const disp = A.disponible; const ent = Math.floor(Math.abs(disp)); const dec = Math.round((Math.abs(disp) - ent) * 100);
  const e = estadoMes(A);
  const wG = A.ingreso > 0 ? Math.min(100, A.gastado / A.ingreso * 100) : 0;
  const wA = A.ingreso > 0 ? Math.min(100 - wG, A.ahorrado / A.ingreso * 100) : 0;
  const actual = A.ym === HOY_YM;
  const stats = actual
    ? [["Por día puedes", sol0(A.porDia)], ["Quedan", `${A.diasRest} día${A.diasRest === 1 ? "" : "s"}`], ["Ahorrado", pct(A.tasaAhorro)]]
    : [["Gastado", sol0(A.gastado)], ["Ahorrado", sol0(A.ahorrado)], ["Tasa de ahorro", pct(A.tasaAhorro)]];
  const sobres = CATS.map(c => { const b = p.presupuestos[c.id] || 0; const s = A.porCat[c.id] || 0; return { c, b, s, r: b > 0 ? s / b : (s > 0 ? 9 : 0) }; })
    .filter(x => x.b > 0 || x.s > 0).sort((a, b) => b.r - a.r);
  const lista = S.verTodos ? sobres : sobres.slice(0, 5);
  const recos = recomendar(A);
  const ult = [...A.movs].sort((a, b) => b.f.localeCompare(a.f)).slice(0, 4);
  return `
  <section class="billete" aria-label="Disponible del mes">
    <canvas id="guilloche" aria-hidden="true"></canvas>
    <div class="fila1"><span class="eyebrow">${disp < 0 ? "Te pasaste por" : "Te queda"} · ${MESES[m - 1]}</span><span class="serie">N° ${A.ym.replace("-", "·")}·S/</span></div>
    <div class="monto${disp < 0 ? " neg" : ""}"><span class="cur">${disp < 0 ? "−" : ""}S/</span>${nf0.format(ent)}<span class="dec">.${pad(dec)}</span></div>
    <div class="de">de ${sol(A.ingreso)} que entraron${A.extra > 0 ? ` (sueldo + ${sol0(A.extra)} extra)` : ""}</div>
    <div class="medidor" role="img" aria-label="${pct(wG / 100)} gastado, ${pct(wA / 100)} ahorrado"><i class="g" style="width:${wG}%"></i><i class="a" style="width:${wA}%"></i></div>
    <div class="stats">${stats.map(([k, v]) => `<div><small>${k}</small><b>${v}</b></div>`).join("")}</div>
  </section>
  <div class="estado">${pill(e)}<p>${e.det}</p></div>
  ${recos.length ? `<button class="teaser" data-act="ir-recos"><span class="num">${recos.length}</span><span><b>${recos.filter(r => r.nivel !== "bien").length ? "Sugerencias para este mes" : "Buenas noticias de tu mes"}</b><span>${esc(recos[0].t)}</span></span>${IC.flecha}</button>` : ""}
  <section class="sec">
    <div class="sec-h"><div><h2>Tus sobres</h2><p class="sub">Lo que separaste para cada cosa este mes</p></div><button class="link" data-act="ajustes-sobres">Editar</button></div>
    <div class="sobres">${lista.map(x => {
      const r = x.b > 0 ? x.s / x.b : 1; const cls = r > 1 ? "crit" : r >= .85 ? "warn" : "";
      const resto = x.b - x.s;
      return `<div class="sobre"><div class="nom">${esc(x.c.n)}<small>${esc(x.c.h)}</small></div>
        <div class="val">${sol0(x.s)} <span style="color:var(--muted)">/ ${sol0(x.b)}</span><small>${resto >= 0 ? `quedan ${sol0(resto)}` : `<span class="over">se pasó ${sol0(-resto)}</span>`}</small></div>
        <div class="meter ${cls}"><i style="width:${Math.min(100, r * 100)}%"></i></div></div>`;
    }).join("")}</div>
    ${sobres.length > 5 ? `<button class="link" data-act="ver-todos" style="margin-top:6px">${S.verTodos ? "Ver menos" : `Ver los ${sobres.length} sobres`}</button>` : ""}
  </section>
  <section class="sec">
    <div class="sec-h"><h2>Lo último</h2><button class="link" data-tab-go="movs">Ver la boleta</button></div>
    ${ult.length ? `<div class="panel" style="padding-block:6px">${ult.map(filaMov).join("")}</div>` : `<div class="panel vacio"><b>Nada anotado en ${MESES[m - 1]}</b>Toca el botón dorado para anotar tu primer gasto. Toma menos de 5 segundos.</div>`}
  </section>`;
}
function filaMov(x) {
  const d = fechaDe(x.f);
  const signo = x.t === "g" ? "−" : x.t === "i" ? "+" : "→ ";
  const sub = [nombreCat(x), x.t === "g" ? PAGO[x.p]?.n : null, `${DIAS_C[d.getDay()]} ${d.getDate()}`].filter(Boolean).join(" · ");
  return `<button class="mov" data-mov="${esc(x.id)}"><span class="dot" style="background:${colorMov(x)}"></span><span class="txt"><b>${esc(x.n || nombreCat(x))}</b><small>${esc(sub)}</small></span><span class="amt${x.t === "i" ? " in" : ""}">${signo}${sol(x.m)}</span></button>`;
}

function vistaMovs(A) {
  const [y, m] = A.ym.split("-").map(Number);
  const f = S.filtro;
  const movs = A.movs.filter(x => f === "todo" || x.t === f).sort((a, b) => b.f.localeCompare(a.f));
  const dias = {}; for (const x of movs) (dias[x.f] ||= []).push(x);
  const chips = [["todo", "Todo"], ["g", "Gastos"], ["i", "Ingresos"], ["a", "Ahorro"]];
  const total = f === "i" ? A.extra : f === "a" ? A.ahorrado : A.gastado;
  const totalLbl = f === "i" ? "Total ingresos extra" : f === "a" ? "Total ahorrado" : "Total gastado";
  return `
  <div class="filtros" role="group" aria-label="Filtrar">${chips.map(([k, n]) => `<button class="chip" data-filtro="${k}" aria-pressed="${f === k}">${n}</button>`).join("")}</div>
  <div class="boleta">
    <div class="boleta-h"><b>Boleta de ${MESES[m - 1]}</b>${A.movs.length} movimientos · ${y}</div>
    ${movs.length ? Object.entries(dias).map(([iso, xs]) => {
      const d = fechaDe(iso); const g = suma(xs.filter(x => x.t === "g"));
      return `<div class="dia"><div class="dia-h"><span>${DIAS_C[d.getDay()]} ${d.getDate()} ${MES_C[d.getMonth()]}</span><span>${g ? "−" + sol(g) : ""}</span></div>${xs.map(filaMov).join("")}</div>`;
    }).join("") : `<div class="vacio"><b>Sin movimientos</b>${f === "todo" ? "Lo que anotes aparecerá aquí, ordenado por día." : "No hay movimientos de este tipo en el mes."}</div>`}
    <div class="total"><span>${totalLbl}</span><b>${sol(total)}</b></div>
  </div>`;
}

function vistaAnalisis(A) {
  const p = S.perfil; const meta = p.ahorroPct / 100;
  const actual = A.ym === HOY_YM;
  const I = A.ingreso || 1;
  const seg = [
    { k: "nec", v: A.nec, meta: .5, n: "Necesidades" },
    { k: "gus", v: A.gus, meta: Math.max(0, .5 - meta), n: "Gustos" },
    { k: "aho", v: A.ahorrado, meta, n: "Ahorro" },
  ];
  const libre = Math.max(0, I - A.nec - A.gus - A.ahorrado);

/* ============ billete: guilloche ============ */
function dibujarBillete() {
  const cv = $("#guilloche"); if (!cv) return;
  const box = cv.getBoundingClientRect(); if (!box.width) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(box.width * dpr); cv.height = Math.round(box.height * dpr);
  const ctx = cv.getContext("2d"); ctx.scale(dpr, dpr);
  const cs = getComputedStyle(document.documentElement);
  ctx.strokeStyle = cs.getPropertyValue("--billete-line").trim() || "rgba(15,90,82,.2)";
  ctx.lineWidth = 0.7;
  const W = box.width, H = box.height;
  const cx = W - Math.min(110, W * 0.24), cy = H * 0.40, R = Math.min(H * 0.42, 96);
  for (let k = 0; k < 22; k++) {
    ctx.beginPath();
    for (let i = 0; i <= 720; i++) {
      const t = i / 720 * Math.PI * 2;
      const rr = R * (0.58 + 0.2 * Math.sin(9 * t + k * 0.29) + 0.07 * Math.cos(17 * t - k * 0.13)) * (0.9 + k * 0.006);
      const x = cx + rr * Math.cos(t), y = cy + rr * Math.sin(t);
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.stroke();
  }
  for (let k = 0; k < 9; k++) {
    ctx.beginPath();
    for (let x = 0; x <= W; x += 2) {
      const y = H * 0.66 + 7 * Math.sin(x / 15 + k * 0.7) * Math.sin(x / 90) + k * 2.2;
      x ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.stroke();
  }
  ctx.fillStyle = ctx.strokeStyle;
  ctx.font = "500 6.5px 'IBM Plex Mono', monospace";
  const micro = "SENCILLO · LO QUE APARTAS PRIMERO NO SE GASTA · ".repeat(12);
  ctx.fillText(micro, 6, H - 3);
}

/* ============ gráfico de ritmo ============ */
function nice(max) {

  for (const d of [1, 10, 20, dm]) g += `<text x="${x(d)}" y="${H - 6}" text-anchor="middle">${d}</text>`;
  const ideal = `<path class="ln-ideal" d="M${x(0)},${y(0)} L${x(dm)},${y(A.limiteGasto)}"/>`;
  let pts = []; for (let d = 0; d <= dia; d++) pts.push(`${x(d).toFixed(1)},${y(A.acum[d]).toFixed(1)}`);
  const real = `<path class="ar-real" d="M${pts.join(" L")} L${x(dia)},${y(0)} L${x(0)},${y(0)} Z"/><path class="ln-real" d="M${pts.join(" L")}"/>`;
  const proy = actual && dia < dm ? `<path class="ln-proy" d="M${x(dia)},${y(A.acum[dia])} L${x(dm)},${y(A.proy)}"/>` : "";
  const ex = x(dia), ey = y(A.acum[dia]);

  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Gasto acumulado del mes: ${sol0(A.acum[dia])} al día ${dia}">${g}${ideal}${real}${proy}${lim}${end}<line class="cross" id="cr" x1="0" x2="0" y1="${pt}" y2="${pt + ih}" visibility="hidden"/><circle class="pt" id="cr-pt" r="4.5" visibility="hidden"/><rect id="hit" x="${pl}" y="0" width="${iw}" height="${H}" fill="transparent"/></svg>`;
  const hit = $("#hit", box), cr = $("#cr", box), cp = $("#cr-pt", box), tip = $("#tip");

  if (!F.c) { F.err = F.t === "g" ? "Elige en qué gastaste." : F.t === "i" ? "Elige de dónde vino." : "Elige a qué meta va."; return pintarHoja(); }

  const mov = { id: F.id || nuevoId(), t: F.t, m: r2(m), c: F.c, n: F.n, f: F.f, p: F.t === "g" ? F.p : null };
  if (F.id) quitarMov(F.id);
  const ym = mov.f.slice(0, 7);
  (S.meses[ym] ||= []).push(mov);
  S.meses[ym].sort((a, b) => a.f.localeCompare(b.f));
  if (mov.t === "a") ajustarMeta(mov.c, mov.m);
  persistirMes(ym);
  const editado = !!F.id;
  cerrarDialog();
  if (ym !== S.ym) { S.ym = ym; }
  S.ia.estado = S.ia.estado === "listo" ? "viejo" : S.ia.estado;
  render();
  toast(editado ? "Cambios guardados" : mov.t === "g" ? `Anotado: ${sol(mov.m)} en ${CAT[mov.c].n.toLowerCase()}` : mov.t === "i" ? `Ingreso de ${sol(mov.m)} anotado` : `${sol(mov.m)} a tu alcancía`);
}
function buscarMov(id) { for (const [ym, l] of Object.entries(S.meses)) { const x = l.find(m => m.id === id); if (x) return { ym, x }; } return null; }
function quitarMov(id) {
  const r = buscarMov(id); if (!r) return;
  S.meses[r.ym] = S.meses[r.ym].filter(m => m.id !== id);
  if (r.x.t === "a") ajustarMeta(r.x.c, -r.x.m);
  persistirMes(r.ym);
}
function ajustarMeta(id, delta) {
  const mt = S.metas.find(m => m.id === id); if (!mt) return;
  mt.ah = r2(Math.max(0, mt.ah + delta)); persistirMetas();
}

function persistirMetas() { if (S.mode === "real") Store.guardar("metas", { lista: S.metas }); }
async function asegurarMes(ym) {

/* ============ Claude ============ */
async function pedirIA() {
  const A = analizar(S.ym); const p = S.perfil;
  const datos = {
    mes: `${MESES[+S.ym.slice(5) - 1]} ${S.ym.slice(0, 4)}`,
    dia_actual: A.dia, dias_del_mes: A.dm, mes_en_curso: S.ym === HOY_YM,
    sueldo_neto: p.sueldo, ingresos_extra: r2(A.extra), meta_ahorro_pct: p.ahorroPct,
    gastado: r2(A.gastado), ahorrado: r2(A.ahorrado), proyeccion_gasto_fin_de_mes: S.ym === HOY_YM ? r2(A.proy) : null,
    limite_para_cumplir_ahorro: r2(A.limiteGasto),
    categorias: CATS.map(c => ({ categoria: c.n, tipo: c.g === "nec" ? "necesidad" : "gusto", gasto_fijo: !!c.fijo, gastado: r2(A.porCat[c.id] || 0), presupuesto: p.presupuestos[c.id] || 0, mes_anterior: A.porCatPrev ? r2(A.porCatPrev[c.id] || 0) : null })).filter(x => x.gastado || x.presupuesto),
    gastos_hormiga: { cantidad: A.hormiga.length, total: r2(suma(A.hormiga)) },
    medios_de_pago: Object.fromEntries(PAGOS.map(x => [x.n, r2(A.porPago[x.id] || 0)])),
    metas_de_ahorro: S.metas.map(m => ({ nombre: m.n, objetivo: m.obj, ahorrado: m.ah, fecha_limite: m.fecha || null })),
    gastos_mas_grandes: [...A.gastos].sort((a, b) => b.m - a.m).slice(0, 12).map(g => ({ monto: g.m, categoria: CAT[g.c]?.n, nota: g.n, fecha: g.f })),
  };
  const prompt = `Eres un asesor de finanzas personales para una persona joven que vive en Perú y maneja su dinero en soles (S/). Revisa su mes y dale recomendaciones concretas, amables y sin juzgar, en español peruano natural (puedes usar palabras como "cachuelo" o "menú" si encajan).

Datos del mes (JSON):
${JSON.stringify(datos)}

Reglas:
- Cada recomendación debe ser una acción concreta que pueda hacer este mes o el próximo, con montos en S/ basados en sus datos.
- No repitas datos sin dar una acción. No recomiendes bancos, marcas ni productos financieros específicos.
- Si algo va bien, puedes incluir como máximo una recomendación de refuerzo positivo.

Responde SOLO con un arreglo JSON de 3 a 5 objetos con esta forma:
[{"titulo": "frase corta de máximo 70 caracteres", "detalle": "2 o 3 oraciones con el porqué y el cómo", "ahorro_mensual": número en soles o null, "prioridad": "alta" | "media" | "baja"}]`;
  S.iaCtl = new AbortController();
  S.ia = { estado: "pensando", items: [], error: "", ym: S.ym };
  render(); $("#recos")?.scrollIntoView({ block: "start" });
  try {
    const res = await S.sample.json(prompt, { signal: S.iaCtl.signal });
    const items = (Array.isArray(res) ? res : []).filter(r => r && r.titulo && r.detalle).slice(0, 5);
    const ord = { alta: 0, media: 1, baja: 2 };
    items.sort((a, b) => (ord[a.prioridad] ?? 1) - (ord[b.prioridad] ?? 1));
    S.ia = items.length ? { estado: "listo", items, ym: S.ym } : { estado: "error", error: "Claude no devolvió recomendaciones esta vez. Prueba de nuevo.", items: [] };
  } catch (e) {
    const c = e && e.code;
    if (c === "cancelled") S.ia = { estado: "idle", items: [] };
    else if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(c)) { S.sample = null; S.ia = { estado: "idle", items: [] }; }
    else S.ia = { estado: "error", items: [], error: c === "rate_limited" ? "Pediste muchos análisis seguidos. Espera unos minutos y vuelve a intentarlo." : c === "session_expired" ? "Tu sesión de Claude expiró. Vuelve a iniciar sesión e inténtalo de nuevo." : "No se pudo completar el análisis. Inténtalo de nuevo en un momento." };
  }
  if (S.tab === "analisis") render();
}

document.addEventListener("click", async e => {
  const t = e.target.closest("button, [data-act]"); if (!t) return;
  const act = t.dataset.act;
  if (t.dataset.tab) { S.tab = t.dataset.tab; render(); scrollTo({ top: 0 }); return; }
  if (t.dataset.tabGo) { S.tab = t.dataset.tabGo; render(); scrollTo({ top: 0 }); return; }
  if (t.dataset.filtro) { S.filtro = t.dataset.filtro; render(); return; }
  if (t.dataset.mov) { const r = buscarMov(t.dataset.mov); if (r) abrirMov({ t: r.x.t, amt: String(r.x.m), c: r.x.c, p: r.x.p || "yape", n: r.x.n || "", f: r.x.f, id: r.x.id }); return; }
  // dentro de la hoja de movimiento
  if (t.dataset.tipo) { F.n = $("#mov-nota")?.value || F.n; F.f = $("#mov-fecha")?.value || F.f; F.t = t.dataset.tipo; F.c = F.t === "i" ? "cachuelo" : F.t === "a" ? (S.metas[0]?.id || "libre") : null; F.err = ""; pintarHoja(); return; }
  if (t.dataset.cat) { F.c = t.dataset.cat; F.err = ""; $$("[data-cat]").forEach(b => b.setAttribute("aria-pressed", b === t)); $(".err", $("#hoja"))?.remove(); return; }
  if (t.dataset.pago) { F.p = t.dataset.pago; $$("[data-pago]").forEach(b => b.setAttribute("aria-pressed", b === t)); return; }
  if (t.dataset.tecla) { tecla(t.dataset.tecla); $(".err", $("#hoja"))?.remove(); return; }
  if (t.dataset.ahorro) { $$("[data-ahorro]").forEach(b => b.setAttribute("aria-pressed", b === t)); return; }
  switch (act) {
    case "nuevo": abrirMov(); break;
    case "cerrar": cerrarDialog(); break;
    case "mes-prev": S.ym = ymAdd(S.ym, -1); await prepararMes(); break;
    case "mes-next": S.ym = ymAdd(S.ym, 1); await prepararMes(); break;
    case "ver-todos": S.verTodos = !S.verTodos; render(); break;
    case "ir-recos": S.tab = "analisis"; render(); requestAnimationFrame(() => $("#recos")?.scrollIntoView({ block: "start", behavior: reduceMotion ? "auto" : "smooth" })); break;
    case "empezar": S.hoja = "empezar"; pintarHoja(); abrirDialog(); setTimeout(() => $("#e-sueldo")?.focus(), 60); break;
    case "ajustes": S.hoja = "ajustes"; pintarHoja(); abrirDialog(); break;
    case "ajustes-sobres": S.hoja = "ajustes-sobres"; pintarHoja(); abrirDialog(); break;
    case "repartir": { const s = parseFloat($("#a-sueldo").value) || S.perfil.sueldo; const ap = Math.min(80, Math.max(0, parseFloat($("#a-ahorro").value) || 0)); const b = presupuestoBase(s, ap); for (const c of CATS) $("#p-" + c.id).value = b[c.id]; actualizarTotalSobres(); break; }
    case "mov-borrar":
      if (!F.borrar) { F.borrar = true; t.textContent = "Toca otra vez para borrar"; return; }
      quitarMov(F.id); cerrarDialog(); render(); toast("Movimiento borrado"); break;
    case "meta-nueva": S.hoja = "meta:"; pintarHoja(); abrirDialog(); break;
    case "meta-editar": S.hoja = "meta:" + t.dataset.meta; pintarHoja(); abrirDialog(); break;
    case "meta-emergencia": S.metas.push({ id: nuevoId(), n: "Fondo de emergencia", obj: fondoSugerido(), ah: 0, fecha: "" }); persistirMetas(); render(); toast("Meta creada"); break;
    case "meta-borrar":
      if (!S.metaBorrar) { S.metaBorrar = true; t.textContent = "Toca otra vez para borrar la meta"; return; }
      S.metas = S.metas.filter(m => m.id !== t.dataset.meta); persistirMetas(); cerrarDialog(); render(); toast("Meta borrada"); break;
    case "aportar": abrirMov({ t: "a", c: t.dataset.meta }); break;
    case "ia": if (S.sample) pedirIA(); break;
    case "ia-parar": S.iaCtl?.abort(); break;
    case "exportar": await exportar(t); break;
    case "importar-ver": $("#imp").hidden = !$("#imp").hidden; break;
    case "importar": await importar(); break;
    case "reset":
      if (!S.resetArmado) { S.resetArmado = true; t.textContent = "Se borrará todo. Toca otra vez para confirmar"; return; }
      await borrarTodo(); break;
  }
});

async function prepararMes() {
  render();

function empezar() {

  S.metas = []; S.meses = { [HOY_YM]: [] }; S.ym = HOY_YM; S.tab = "mes"; S.ia = { estado: "idle", items: [] };

function guardarAjustes() {

  const d = parseInt($("#a-dia").value, 10); if (d >= 1 && d <= 31) p.diaPago = d;
  const a = parseFloat($("#a-ahorro").value); if (a >= 0 && a <= 80) p.ahorroPct = a;

function guardarMeta() {

  try { await navigator.clipboard.writeText(txt); toast("Respaldo copiado. Guárdalo en tus notas o en un chat contigo."); }
  catch (e) {
    $("#imp").hidden = false; const ta = $("#imp-txt"); ta.value = txt; ta.focus(); ta.select();
    toast("Selecciona el texto y cópialo a mano.");
  }
}
async function importar() {
  let d; try { d = JSON.parse($("#imp-txt").value); } catch (e) { toast("Ese texto no es un respaldo válido."); return; }
  if (!d || d.app !== "sencillo" || !d.perfil || !d.perfil.sueldo) { toast("Ese texto no es un respaldo de Sencillo."); return; }
  S.mode = "real";
  S.perfil = { ...d.perfil, meses: Object.keys(d.meses || {}).sort(), presupuestos: { ...presupuestoBase(d.perfil.sueldo, d.perfil.ahorroPct || 20), ...(d.perfil.presupuestos || {}) } };
  S.metas = Array.isArray(d.metas) ? d.metas : [];
  S.meses = d.meses || {};
  persistirPerfil(); persistirMetas();
  for (const ym of S.perfil.meses) Store.guardar("mes-" + ym, { movs: S.meses[ym] || [] });
  if (!S.meses[HOY_YM]) S.meses[HOY_YM] = [];
  cerrarDialog(); S.ym = HOY_YM; render(); toast("Respaldo restaurado");
}
async function borrarTodo() {
  const meses = [...(S.perfil.meses || [])];
  for (const ym of meses) await Store.borrar("mes-" + ym);
  await Store.borrar("metas"); await Store.borrar("perfil");
  S.resetArmado = false; cerrarDialog(); cargarDemo(); S.ym = HOY_YM; S.tab = "mes"; render();
  toast("Se borraron tus datos");
}

let toastT;
function toast(msg) { const el = $("#toast"); el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 2600); }

let rsT; addEventListener("resize", () => { clearTimeout(rsT); rsT = setTimeout(() => { if (S.tab === "mes") dibujarBillete(); if (S.tab === "analisis") chartRitmo(analizar(S.ym)); }, 120); });
const redibujar = () => { if (S.tab === "mes") requestAnimationFrame(dibujarBillete); };
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", redibujar);
new MutationObserver(redibujar).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
document.fonts?.ready.then(redibujar);

/* ============ arranque ============ */
async function boot() {
  const cp = Store.lsGet("perfil");
  if (cp && cp.sueldo) {
    S.mode = "real"; S.perfil = cp; S.metas = (Store.lsGet("metas") || {}).lista || [];
    for (const ym of [HOY_YM, ymAdd(HOY_YM, -1)]) S.meses[ym] = (Store.lsGet("mes-" + ym) || {}).movs || [];
  } else cargarDemo();
  render();

  const sampleP = (window.claude && typeof window.claude.use === "function") ? window.claude.use("sample").catch(() => null) : Promise.resolve(null);
  await Store.conectar();
  if (Store.kind === "db") {
    const p = await Store.leer("perfil");
    if (p && p.sueldo) {
      S.mode = "real"; S.perfil = { meses: [], ...p };
      S.metas = (await Store.leer("metas"))?.lista || [];
      S.meses = {};
      for (const ym of [HOY_YM, ymAdd(HOY_YM, -1)]) S.meses[ym] = (await Store.leer("mes-" + ym))?.movs || [];
    } else if (S.mode === "real") {
      // Había datos guardados solo en este navegador: se suben a la cuenta.
      persistirPerfil(); persistirMetas();
      for (const ym of S.perfil.meses || []) { const d = Store.lsGet("mes-" + ym); if (d) Store.guardar("mes-" + ym, d); }
    }
  }
  S.cargando = false;
  render();
  S.sample = await sampleP;
  if (S.sample && S.tab === "analisis") render();
}
boot();
</script>
